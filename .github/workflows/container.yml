name: "\U0001F4E6 Publish Container (GHCR)"

on:
  push:
    # This repo's default branch is `master` (there is no `main`), so the base
    # image was never rebuilt and deployments served a stale frontend/backend.
    branches: [master, main]
    paths:
      - "container/**"
      - "backend/**"
      - "frontend/**"
      # The frontend resolves @homepilot/* from ../packages at build time and
      # each package extends tsconfig.base.json, so both are baked into the
      # image. Without them here the published image goes stale on a shared
      # package change.
      - "packages/**"
      - "tsconfig.base.json"
      - ".dockerignore"
      - ".github/workflows/container.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-publish
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/homepilot

jobs:
  # Each architecture is built on a runner of that architecture and pushed
  # by digest; the `merge` job below stitches the digests into one multi-arch
  # manifest under the real tags.
  #
  # This replaces a single `platforms: linux/amd64,linux/arm64` build on an
  # amd64 runner, where the whole arm64 leg ran under QEMU emulation. That
  # emulation was the build failure: the arm64 `npm ci` alone ran for over
  # two hours (run #13) without finishing, against ~50 minutes for a cold
  # end-to-end build before it. GitHub-hosted arm64 runners are free for
  # public repositories, so there is no reason to emulate.
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    # A cold native build is well under an hour. Cap it so a hung build fails
    # visibly instead of burning the 6-hour default.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Prepare platform slug
        run: echo "PLATFORM_PAIR=${{ matrix.platform }}" | tr '/' '-' >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=homepilot
            org.opencontainers.image.description=HomePilot — self-hosted AI assistant with GPU support for RunPod, Colab, and personal machines

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Frontend feature flags baked at build time. Empty = today's behavior
          # (OFF); set these as repository variables to enable the OllaBridge
          # account UX / BFF session for every deployment that uses this image.
          build-args: |
            VITE_ACCOUNTS_UX=${{ vars.VITE_ACCOUNTS_UX }}
            VITE_BFF_SESSION=${{ vars.VITE_BFF_SESSION }}
            VITE_OLLABRIDGE_CLOUD_URL=${{ vars.VITE_OLLABRIDGE_CLOUD_URL }}
          # Tags are applied by the merge job; this leg only uploads a blob.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          # Per-architecture cache scopes. A shared scope would have the two
          # legs overwrite each other's layers on every run.
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Push multi-arch manifest
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 15

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=semver,pattern=v{{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}
          labels: |
            org.opencontainers.image.title=homepilot
            org.opencontainers.image.description=HomePilot — self-hosted AI assistant with GPU support for RunPod, Colab, and personal machines

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect published manifest
        run: |
          docker buildx imagetools inspect \
            "${REGISTRY}/${IMAGE_NAME}:${{ steps.meta.outputs.version }}"
