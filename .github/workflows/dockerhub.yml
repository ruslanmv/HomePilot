name: "\U0001F4E6 Publish Docker (Docker Hub)"

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g., v1.2.3 or 1.2.3)"
        required: true

permissions:
  contents: read

concurrency:
  group: dockerhub-publish
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Normalize the release version once so both the build matrix and the
  # manifest merge agree on the tags.
  # ------------------------------------------------------------------
  prepare:
    name: Derive release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      semver: ${{ steps.version.outputs.semver }}
      short_sha: ${{ steps.version.outputs.short_sha }}
      build_date: ${{ steps.version.outputs.build_date }}

    steps:
      - name: Derive release version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            RAW="${GITHUB_REF#refs/tags/}"
          else
            RAW="${{ github.event.inputs.version }}"
          fi
          if [ -z "$RAW" ]; then
            echo "Version not provided."; exit 1
          fi
          if [[ "$RAW" =~ ^v ]]; then
            RELEASE_TAG="$RAW"
            SEMVER="${RAW#v}"
          else
            RELEASE_TAG="v$RAW"
            SEMVER="$RAW"
          fi
          {
            echo "release_tag=$RELEASE_TAG"
            echo "semver=$SEMVER"
            echo "short_sha=${GITHUB_SHA::7}"
            echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved RELEASE_TAG=${RELEASE_TAG}, SEMVER=${SEMVER}"

  # ------------------------------------------------------------------
  # One native runner per architecture, each pushing by digest. The
  # previous single-job `platforms: linux/amd64,linux/arm64` build ran the
  # whole arm64 leg under QEMU on an amd64 runner, where the emulated
  # `npm ci` alone could run for hours without finishing. GitHub-hosted
  # arm64 runners are free for public repositories.
  # ------------------------------------------------------------------
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    needs: [prepare]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Prepare platform slug
        run: echo "PLATFORM_PAIR=${{ matrix.platform }}" | tr '/' '-' >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      # docker.io requires a lowercase namespace. Computed per job rather
      # than passed as a job output, because outputs derived from a secret
      # come back redacted.
      - name: Compute image name (lowercase)
        shell: bash
        run: |
          USER_RAW="${{ secrets.DOCKERHUB_USERNAME }}"
          USER_LC="${USER_RAW,,}"
          echo "IMAGE=docker.io/${USER_LC}/homepilot" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata (labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=homepilot
            org.opencontainers.image.description=HomePilot — self-hosted AI assistant with GPU support for RunPod, Colab, and personal machines
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.semver }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ needs.prepare.outputs.build_date }}

      - name: Build & push by digest (Docker Hub)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./container/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Tags are applied by the merge job; this leg only uploads a blob.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Per-architecture cache scopes; a shared scope would have the two
          # legs overwrite each other's layers on every run.
          cache-from: type=gha,scope=dockerhub-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=dockerhub-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Push multi-arch manifest (Docker Hub)
    runs-on: ubuntu-latest
    needs: [prepare, build]
    timeout-minutes: 20

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Compute image name (lowercase)
        shell: bash
        run: |
          USER_RAW="${{ secrets.DOCKERHUB_USERNAME }}"
          USER_LC="${USER_RAW,,}"
          echo "IMAGE=docker.io/${USER_LC}/homepilot" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            # stable semver tags (always)
            type=raw,value=v${{ needs.prepare.outputs.semver }}
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.semver }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.semver }}
            type=semver,pattern={{major}},value=${{ needs.prepare.outputs.semver }}
            # short sha tag (always)
            type=raw,value=sha-${{ needs.prepare.outputs.short_sha }}
            # latest only on release
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
          labels: |
            org.opencontainers.image.title=homepilot
            org.opencontainers.image.description=HomePilot — self-hosted AI assistant with GPU support for RunPod, Colab, and personal machines
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.semver }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ needs.prepare.outputs.build_date }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      # Guard: image must not contain baked secrets or user data
      - name: Sanity guard — no baked secrets
        shell: bash
        run: |
          docker run --rm --entrypoint /bin/bash \
            "${IMAGE}:v${{ needs.prepare.outputs.semver }}" -lc \
            'test ! -f /home/user/app/data/.env.json && test ! -f /home/user/app/.env'
          echo "OK: no baked secrets in image"

      - name: Inspect multi-arch manifest
        if: always()
        shell: bash
        run: |
          SEMVER="${{ needs.prepare.outputs.semver }}"
          echo "Inspecting v${SEMVER}…"
          docker buildx imagetools inspect "${IMAGE}:v${SEMVER}"
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "Inspecting latest…"
            docker buildx imagetools inspect "${IMAGE}:latest"
          fi
