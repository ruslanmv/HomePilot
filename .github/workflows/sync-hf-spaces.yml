name: Sync HomePilot to Hugging Face Spaces

# This ships master to https://huggingface.co/spaces/ruslanmv/HomePilot.
# The Oracle production site (https://homepilot.ruslanmv.com) is not updated
# here. It deploys the GHCR image published for the same commit — see
# .github/workflows/oracle.yml — and both expose the commit at GET /version.

on:
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'community/**'
      - 'hf/**'
      - 'deploy/huggingface-space/**'
      # Also in the Space bundle (deploy-hf.sh copies them): a change only here used to
      # leave the Space on an older build.
      - 'expert/**'
      - 'packages/**'
      - 'scripts/download.py'
      - 'tsconfig.base.json'
      - '.github/workflows/sync-hf-spaces.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    name: Deploy Builder + Installer to HF Spaces
    runs-on: ubuntu-latest
    concurrency:
      group: hf-space-sync-homepilot
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install git-lfs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git-lfs
          git lfs install

      - name: Deploy to HF Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          bash deploy/huggingface-space/scripts/deploy-hf.sh

      # The push above only hands the bundle to Hugging Face, which then builds it. A failed
      # build keeps the previous image serving, so wait for this commit to be the one running
      # and for a "hello" to be answered — by /chat and by the chat's default Fast path.
      - name: Verify the Space serves this commit and answers
        timeout-minutes: 45
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python3 deploy/huggingface-space/scripts/verify_space.py
