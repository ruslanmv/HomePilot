# Nginx reverse proxy for HomePilot Container
# Routes all traffic through a single port (7860)

worker_processes auto;
pid /var/run/nginx/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    # Logging
    access_log /var/log/nginx/access.log;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Common proxy parameters shared by every backend-bound location.
    # Keeping them in a named map lets us update timeouts / headers in
    # one place instead of copy-pasting across every location block.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 60s;

    # Needed so the `Connection: upgrade` header only fires on WS
    # upgrades — otherwise keep-alive is kept on plain HTTP.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Is this a page load (the browser navigating) or an API call? Navigations
    # ask for text/html; fetch()/XHR, EventSource and WebSocket requests don't.
    map $http_accept $hp_page_request {
        default         0;
        "~*text/html"   1;
    }

    server {
        listen 7860;
        server_name _;

        # ────────────────────────────────────────────────────────
        # Health — the backend serves it at /health. /api/health is
        # what the Docker HEALTHCHECK, the desktop app and
        # CONTAINER.md use, so both map to it. (Exact matches win
        # over every other location.)
        # ────────────────────────────────────────────────────────
        location = /health {
            proxy_pass http://127.0.0.1:8000/health;
        }
        location = /api/health {
            proxy_pass http://127.0.0.1:8000/health;
        }

        # ────────────────────────────────────────────────────────
        # Backend routes whose paths are always the API, whatever
        # the client asks for (FastAPI's own /docs pages included).
        # Regex locations beat the prefix location below.
        # ────────────────────────────────────────────────────────
        location ~ ^/(api|v1|studio|files|files-legacy|view|preflight|models|openapi\.json|docs|redoc)(/|$) {
            proxy_pass http://127.0.0.1:8000;
        }

        # ────────────────────────────────────────────────────────
        # Everything else. The frontend calls most of the API at the
        # site root (/chat, /conversations, /projects, /persona/…,
        # /upload, …), so a fixed prefix list can't separate it from
        # the app's own pages. Instead:
        #   • a built file that exists is served from disk;
        #   • a page load (Accept: text/html) gets the app;
        #   • any other request is the API.
        # ────────────────────────────────────────────────────────
        location / {
            root /home/user/app/static;
            index index.html;

            error_page 418 = @app_page;
            if ($hp_page_request) {
                return 418;
            }
            try_files $uri @backend;

            # Cache fingerprinted static assets aggressively. The
            # Vite build emits hashed filenames so immutable caching
            # is safe; index.html stays un-cached so new releases
            # propagate instantly.
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                try_files $uri @backend;
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # The single-page app for any page load (/, /terms, /privacy, …).
        location @app_page {
            root /home/user/app/static;
            try_files /index.html =404;
            add_header Cache-Control "no-cache";
        }

        location @backend {
            proxy_pass http://127.0.0.1:8000;
        }
    }
}
