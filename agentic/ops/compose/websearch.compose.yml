# Standalone compose for SearXNG + Web Search MCP server.
# Usage: docker compose -f agentic/ops/compose/websearch.compose.yml up --build
#
# SearXNG provides web search without API keys (home mode).
# The MCP server exposes hp.web.search and hp.web.fetch via JSON-RPC on /rpc.

services:
  searxng:
    image: searxng/searxng:latest
    container_name: hp-searxng
    ports:
      # This computer only: a search engine on the LAN is somebody else's search engine.
      # 8899 by default rather than 8080, which so many tools take; SEARXNG_PORT changes it
      # (then point SEARXNG_BASE_URL at the same port).
      - "127.0.0.1:${SEARXNG_PORT:-8899}:8080"
    volumes:
      # Turns the JSON API on (off in a stock install) — see the file.
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - BASE_URL=http://127.0.0.1:${SEARXNG_PORT:-8899}/
      # Generated when the container is created (`make start-searxng`); never written to a file.
      - SEARXNG_SECRET=${SEARXNG_SECRET:?set SEARXNG_SECRET, or use make start-searxng}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    restart: unless-stopped
    networks:
      - hp-websearch

  hp-mcp-web-search:
    build:
      context: ../../..
      dockerfile: agentic/ops/compose/dockerfiles/mcp_web_search.Dockerfile
    ports:
      - "9105:9105"
    environment:
      - PORT=9105
      - WEB_SEARCH_PROVIDER=searxng
      - SEARXNG_BASE_URL=http://searxng:8080
    depends_on:
      - searxng
    restart: unless-stopped
    networks:
      - hp-websearch

networks:
  hp-websearch:
    driver: bridge
